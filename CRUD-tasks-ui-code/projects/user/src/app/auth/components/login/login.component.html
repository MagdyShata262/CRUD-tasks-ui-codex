<div class="login d-flex justify-content-center align-items-center">
  <div class="row w-100 h-100">

    <!-- Left Side: Image -->
    <div class="col-md-6 p-0 position-relative">
      <img src="../../../../assets/desola-lanre-ologun-zYgV-NGZtlA-unsplash.jpg" alt="Login Background"
        class="img-fluid h-100 object-fit-cover">
      <div class="overlay"></div>
    </div>

    <!-- ✅ Right Side: Login Form (Now outside the left column) -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="box w-75">
        <h2 class="text-center mb-4">Login</h2>

        <!-- Show error message -->
        <div *ngIf="errorMessage" class="alert alert-danger text-center">
          {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-100">

          <!-- Email Field -->
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="email" placeholder="Enter your email" formControlName="email" required>
            <mat-error *ngIf="f['email'].hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="f['email'].hasError('email')">
              Please enter a valid email address
            </mat-error>
          </mat-form-field>

          <!-- Password Field -->
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput type="password" placeholder="Enter your password" formControlName="password" required>
            <mat-error *ngIf="f['password'].hasError('required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="f['password'].hasError('minlength')">
              Password must be at least 6 characters
            </mat-error>
          </mat-form-field>

          <!-- Submit Button -->
          <div class="d-flex justify-content-center mt-3 position-relative">
            <button mat-raised-button color="warn" type="submit" [disabled]="isLoading || loginForm.invalid"
              class="w-100 position-relative">
              <span *ngIf="!isLoading">Login</span>
              <div *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
                <mat-spinner diameter="20"></mat-spinner>
                <span>Signing In...</span>
              </div>
            </button>
          </div>

          <!-- Register Link -->
          <div class="d-flex justify-content-center mt-3">
            <a routerLink="/auth/register" class="text-decoration-none">Create account?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
